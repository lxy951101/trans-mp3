<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 512px;
        height: 512px;
        background: transparent;
        overflow: hidden;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8b6cff" />
          <stop offset="52%" stop-color="#5b8cff" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
          <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4c2fd6" flood-opacity="0.45" />
        </filter>
      </defs>

      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" filter="url(#soft)" />
      <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#gloss)" />

      <g
        stroke="#ffffff"
        stroke-width="26"
        stroke-linecap="round"
        fill="none"
        opacity="0.96"
      >
        <line x1="150" y1="248" x2="150" y2="264" />
        <line x1="212" y1="190" x2="212" y2="322" />
        <line x1="274" y1="150" x2="274" y2="362" />
        <line x1="336" y1="206" x2="336" y2="306" />
      </g>

      <circle cx="256" cy="404" r="12" fill="#ffffff" opacity="0.85" />
    </svg>
  </body>
</html>

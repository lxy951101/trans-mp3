appId: com.musictool.app
productName: 音乐批量处理器
copyright: Copyright © 2026 music-tool
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
  # 二进制走 extraResources，避免被 electron-builder 的 smartUnpack 再复制一遍
  - '!node_modules/ffmpeg-static/**'
  - '!node_modules/ffprobe-static/**'
extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: bin/ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: bin/ffprobe.exe
win:
  executableName: music-tool
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 音乐批量处理器
